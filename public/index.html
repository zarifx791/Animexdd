<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animexd — Anime Episodes</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#141824;--line:#282e40;--text:#f4f6ff;--muted:#a9b0c5;--accent:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c1740 0,#090b12 48%);color:var(--text);font:16px system-ui,Arial,sans-serif}header{padding:22px max(18px,calc((100% - 1100px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}a{color:inherit}.logo{font-size:25px;font-weight:900;letter-spacing:.4px}.logo span{color:#a78bfa}.admin{border:1px solid #4b426e;border-radius:12px;padding:9px 13px;text-decoration:none}.hero{max-width:1100px;margin:auto;padding:38px 18px 20px}.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.06;margin:0 0 12px}.hero p{color:var(--muted);margin:0 0 22px}.search{width:100%;max-width:500px;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:#10131d;color:white;font-size:16px}.wrap{max-width:1100px;margin:auto;padding:14px 18px 55px}.section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 18px}.section h2{margin:0}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:linear-gradient(160deg,#191e2d,#11141e);border:1px solid var(--line);border-radius:17px;overflow:hidden}.thumb{height:135px;background:linear-gradient(135deg,#34265f,#171c2d);display:grid;place-items:center;font-size:42px}.body{padding:15px}.body h3{margin:0 0 7px;font-size:18px;overflow-wrap:anywhere}.body p{margin:0 0 14px;color:var(--muted);font-size:14px;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--accent);color:white;font-weight:700;text-decoration:none;cursor:pointer}.btn.alt{background:#252b3d}.empty{padding:35px;border:1px dashed #3b4156;border-radius:15px;color:var(--muted);text-align:center}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:15px;z-index:3}.modal.show{display:flex}.modalbox{background:#10131d;border:1px solid var(--line);border-radius:16px;width:min(900px,100%);padding:15px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal video{width:100%;max-height:70vh;margin-top:12px;background:black;border-radius:10px}footer{text-align:center;color:var(--muted);padding:25px;border-top:1px solid var(--line);font-size:13px}
</style></head><body>
<header><a class="logo" href="/" style="text-decoration:none">Anime<span>xd</span></a><nav style="display:flex;gap:8px;flex-wrap:wrap"><a class="admin" href="/credits.html">Credits & Copyright</a><a class="admin" href="/admin.html">Admin panel ↗</a></nav></header>
<section class="hero"><h1>Your anime corner.</h1><p>Find an episode, press play, and enjoy.</p><input class="search" id="search" placeholder="Search episodes…" autocomplete="off"></section>
<main class="wrap"><div class="section"><h2>Episodes</h2><span class="count" id="count"></span></div><div class="grid" id="episodes"></div></main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><strong id="modalTitle">Watch episode</strong><button class="btn alt" id="close">Close ✕</button></div><video id="player" controls playsinline></video><p id="modalDesc"></p><a id="download" class="btn" download>Download episode</a></div></div>
<footer>Animexd • Only watch or download videos you have permission to distribute.<br><br>Contact: <a href="mailto:zerogaming990776@gmail.com" style="color:#c4b5fd">zerogaming990776@gmail.com</a></footer>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let episodes=[];
async function load(){try{const r=await fetch('/api/episodes');episodes=await r.json();render()}catch{document.getElementById('episodes').innerHTML='<div class="empty">Could not load episodes. Please try again later.</div>'}}
function render(){const q=document.getElementById('search').value.toLowerCase();const list=episodes.filter(e=>(e.title+' '+(e.description||'')).toLowerCase().includes(q));document.getElementById('count').textContent=list.length+' episode(s)';document.getElementById('episodes').innerHTML=list.length?list.map(e=>`<article class="card"><div class="thumb">▶</div><div class="body"><h3>${esc(e.title)}</h3><p>${esc(e.description||'Anime episode')}</p><div class="actions"><button class="btn" onclick="watch('${esc(e.id)}')">▶ Watch</button><a class="btn alt" href="${esc(e.videoUrl)}" download>↓ Download</a></div></div></article>`).join(''):'<div class="empty">No episodes published yet. Check back soon!</div>'}
function watch(id){const e=episodes.find(x=>x.id===id);if(!e)return;document.getElementById('modalTitle').textContent=e.title;document.getElementById('modalDesc').textContent=e.description||'';document.getElementById('player').src=e.videoUrl;document.getElementById('download').href=e.videoUrl;document.getElementById('modal').classList.add('show')}
function close(){document.getElementById('player').pause();document.getElementById('player').removeAttribute('src');document.getElementById('modal').classList.remove('show')}
document.getElementById('search').addEventListener('input',render);document.getElementById('close').addEventListener('click',close);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});load();
</script></body></html>
