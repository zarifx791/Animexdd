<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090910"><title>Watch — Animexd</title>
<style>
:root{color-scheme:dark;--bg:#090910;--panel:#151520;--line:#302d40;--muted:#aaa8bd;--violet:#c2a2ff;--pink:#f58ac0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f6ff;font:15px/1.5 system-ui,Arial}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.top{height:58px;border-bottom:1px solid #ffffff14;display:flex;align-items:center;padding:0 max(14px,calc((100% - 1180px)/2));gap:18px;background:#0c0c14}.brand{font-size:23px;font-weight:950}.brand span{color:var(--violet)}.back{margin-left:auto;color:#d4c2f0;font-size:13px}
.layout{max-width:1180px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px}.main{min-width:0}.screen{width:100%;aspect-ratio:16/9;background:#000;border-radius:13px;overflow:hidden;border:1px solid #282333}.screen video,.screen iframe{width:100%;height:100%;display:block;border:0;object-fit:contain;background:#000}.title{font-size:22px;line-height:1.25;margin:15px 0 12px}.channel{display:flex;align-items:center;gap:11px;padding:10px 0}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6e46a2,#bd5eae);display:grid;place-items:center;font-weight:900}.channel-info{flex:1;min-width:0}.channel-info b{display:block}.muted{color:var(--muted);font-size:12px}.pill{border:0;border-radius:22px;background:#eee;color:#17131e;font-weight:800;padding:9px 16px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 16px}.action{border:1px solid #383347;background:#211e2b;color:#eee;border-radius:22px;padding:9px 15px}.description{background:#191823;border:1px solid #302d40;border-radius:13px;padding:13px;color:#c9c5d4;font-size:13px;white-space:pre-wrap}.side h2{font-size:17px;margin:0 0 12px}.ep-card{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;margin-bottom:13px;padding:8px;border:1px solid #302d40;border-radius:12px;background:#15141e}.thumb{width:132px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#282333}.ep-meta{min-width:0;display:flex;flex-direction:column;justify-content:center}.ep-meta b{font-size:13px;line-height:1.3}.ep-meta small{color:var(--muted);font-size:11px;margin-top:5px}.ep-card.active{border-color:#a77be4;background:#211a2c}.ep-card button{border:0;background:none;color:inherit;text-align:left;padding:0;min-width:0}.badge{font-size:10px;color:#c6a5ef;letter-spacing:1px;font-weight:900}.empty{color:var(--muted);padding:20px;border:1px dashed #494258;border-radius:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:12px}.side{margin-top:8px}.side-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ep-card{grid-template-columns:112px minmax(0,1fr);margin:0}.thumb{width:112px}}
@media(max-width:520px){.title{font-size:19px}.side-list{grid-template-columns:1fr}.ep-card{grid-template-columns:124px minmax(0,1fr)}.thumb{width:124px}.top{padding:0 13px}}
</style></head><body>
<header class="top"><a class="brand" href="/">Anime<span>xd</span></a><a id="gallery" class="back" href="/">← Anime Gallery</a></header>
<main class="layout"><section class="main"><div class="screen" id="screen"><div class="empty">Loading player…</div></div><h1 class="title" id="watchTitle">Loading episode…</h1><div class="channel"><div class="avatar">A</div><div class="channel-info"><b id="animeTitle">Animexd</b><span class="muted" id="subline">Episode player</span></div><button class="pill" id="share">↗ Share</button></div><div class="actions"><button class="action" id="prev">← Previous</button><button class="action" id="next">Next →</button><button class="action" id="copy">▣ Copy link</button></div><div class="description" id="description">Episode information will appear here.</div></section>
<aside class="side"><h2>Up next <span class="muted" id="count"></span></h2><div class="side-list" id="episodes"><div class="empty">Loading episodes…</div></div></aside></main>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search),animeId=params.get('id'),episodeId=params.get('ep');let anime=null,eps=[],current=0;
function thumbFor(e,i){const shots=anime?.screenshots||[];return e.thumbnailUrl||shots[i%Math.max(shots.length,1)]||anime?.poster||''}
function renderPlayer(){const e=eps[current];if(!e)return;document.getElementById('watchTitle').textContent=e.title||('Episode '+(current+1));document.getElementById('animeTitle').textContent=anime.title;document.getElementById('subline').textContent='Episode '+(current+1)+' · '+eps.length+' episodes';document.getElementById('description').textContent=e.description||'Now watching '+anime.title+'.';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===eps.length-1;
const url=e.videoUrl||'';const screen=document.getElementById('screen');if(e.videoMode==='embed'){screen.innerHTML='<iframe src="'+esc(url)+'" title="'+esc(e.title||'Episode player')+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';}else{screen.innerHTML='<video controls playsinline preload="metadata" src="'+esc(url)+'"></video>';}
history.replaceState(null,'','/watch.html?id='+encodeURIComponent(animeId)+'&ep='+encodeURIComponent(e.id));document.title=(e.title||'Episode')+' — '+anime.title+' | Animexd';renderList();}
function renderList(){document.getElementById('count').textContent='('+eps.length+')';document.getElementById('episodes').innerHTML=eps.map((e,i)=>'<article class="ep-card '+(i===current?'active':'')+'"><button data-ep="'+i+'"><img class="thumb" loading="lazy" src="'+esc(thumbFor(e,i))+'" alt="" onerror="this.src=\'/assets/episode-placeholder.jpg\';this.onerror=null"></button><button class="ep-meta" data-ep="'+i+'"><span class="badge">EPISODE '+String(i+1).padStart(2,'0')+'</span><b>'+esc(e.title||('Episode '+(i+1)))+'</b><small>'+(i===current?'▶ Now playing':'Watch episode')+'</small></button></article>').join('');document.querySelectorAll('[data-ep]').forEach(b=>b.addEventListener('click',()=>{current=Number(b.dataset.ep);renderPlayer();window.scrollTo({top:0,behavior:'smooth'});}));}
async function init(){try{if(!animeId||!episodeId)throw Error('Anime or episode link is missing.');const r=await fetch('/api/anime/'+encodeURIComponent(animeId));const data=await r.json();if(!r.ok)throw Error(data.error||'Anime not found.');anime=data;eps=data.episodes||[];current=eps.findIndex(e=>e.id===episodeId);if(current<0)throw Error('Episode not found.');document.getElementById('gallery').href='/anime.html?id='+encodeURIComponent(animeId);renderPlayer();}catch(e){document.getElementById('screen').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
document.getElementById('prev').addEventListener('click',()=>{if(current>0){current--;renderPlayer();}});document.getElementById('next').addEventListener('click',()=>{if(current<eps.length-1){current++;renderPlayer();}});
document.getElementById('share').addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title:document.title,url:location.href})}catch(_){}}else{await navigator.clipboard?.writeText(location.href);alert('Link copied');}});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);alert('Link copied');}catch(_){alert(location.href);}});
init();
</script></body></html>
