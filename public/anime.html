<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime details — Animexd</title>
<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#111114;--line:#29292f;--muted:#b4b4c0;--purple:#b67aff;--pink:#ff4fa3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0,#22202b,#08090d 50%);color:#f8f7fb;font:16px system-ui,Arial}header{padding:18px max(16px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;border-bottom:1px solid #24242b;gap:12px;flex-wrap:wrap}.logo{font-size:24px;font-weight:900;text-decoration:none;color:white}.logo span{color:var(--purple)}a{color:inherit}.wrap{max-width:1120px;margin:auto;padding:24px 16px 60px}.hero{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:26px;align-items:center;padding:24px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(130deg,#17171c,#0c0c10)}.poster{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:#20202a}.eyebrow{color:var(--purple);font-weight:750}.hero h1{font-size:clamp(28px,5vw,44px);margin:8px 0}.muted{color:var(--muted);line-height:1.65}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{border:1px solid #46315d;border-radius:30px;padding:7px 12px;background:#241632;color:#d9b6ff;font-size:13px}.section{margin-top:26px;padding:22px;border:1px solid var(--line);border-radius:18px;background:#101014}.section h2{margin-top:0;color:var(--purple)}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.fact{padding:15px;background:#19191f;border:1px solid #2b2b32;border-radius:12px}.fact small{display:block;color:#a9a9b7;margin-bottom:6px}.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.screens img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#222}.episode{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border:1px solid #2d2d36;background:#17171d;border-radius:12px;margin:10px 0}.btn{display:inline-block;border:0;background:#8247c9;color:white;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:750;cursor:pointer}.empty{color:var(--muted);padding:20px;border:1px dashed #444;border-radius:12px}footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}@media(max-width:620px){.hero{grid-template-columns:1fr}.poster{max-width:250px;margin:auto}.episode{align-items:flex-start;flex-direction:column}}
</style></head><body><header><a class="logo" href="/">Anime<span>xd</span></a><a href="/">← Back to catalogue</a></header><main class="wrap" id="content"><div class="empty">Loading anime details…</div></main><footer>Animexd • Credits are for information and appreciation; they do not imply distribution rights.<br>Rights or removal request: <a href="mailto:zerogaming990776@gmail.com">zerogaming990776@gmail.com</a></footer>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');
async function init(){try{if(!id)throw Error('No anime was selected.');const r=await fetch('/api/anime/'+encodeURIComponent(id));const a=await r.json();if(!r.ok)throw Error(a.error||'Anime not found.');const eps=a.episodes||[];document.title=a.title+' — Animexd';document.getElementById('content').innerHTML='<section class="hero"><img class="poster" src="'+esc(a.poster)+'" alt="'+esc(a.title)+' poster" onerror="this.style.visibility=\'hidden\'"><div><div class="eyebrow">ANIMEXD • ANIME DETAILS</div><h1>'+esc(a.title)+'</h1><p class="muted">'+esc(a.overview||'Story overview has not been added yet.')+'</p><div class="chips">'+[a.year,a.genre,a.language].filter(Boolean).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div></div></section><section class="section"><h2>Overview & Credits</h2><div class="facts"><div class="fact"><small>ANIMATION STUDIO</small><b>'+esc(a.studio||'Not added')+'</b></div><div class="fact"><small>WRITER / CREATOR</small><b>'+esc(a.writer||'Not added')+'</b></div><div class="fact"><small>RELEASE YEAR</small><b>'+esc(a.year||'Not added')+'</b></div><div class="fact"><small>EPISODES AVAILABLE</small><b>'+eps.length+'</b></div></div><p class="muted">Credits are provided for identification and appreciation. Animexd only provides streaming or downloads for content the site has permission to distribute.</p></section><section class="section"><h2>Screenshots</h2><div class="screens">'+(a.screenshots||[]).map(s=>'<img loading="lazy" src="'+esc(s)+'" alt="Anime screenshot" onerror="this.style.display=\'none\'">').join('')+'</div>'+(!(a.screenshots||[]).length?'<p class="muted">Screenshots will appear here when added by the admin.</p>':'')+'</section><section class="section"><h2>Episodes & Downloads</h2>'+(eps.length?eps.map((e,i)=>'<div class="episode"><div><b>'+esc(e.title||('Episode '+(i+1)))+'</b><div class="muted">'+esc(e.description||'')+'</div></div><div><a class="btn" href="'+esc(e.videoUrl)+'" target="_blank" rel="noopener">▶ Watch</a> <a class="btn" href="'+esc(e.videoUrl)+'" download>↓ Download</a></div></div>').join(''):'<div class="empty">No episodes linked to this anime yet. Admin can add episodes and choose this series in the admin panel.</div>')+'</section>'}catch(e){document.getElementById('content').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
init();
</script></body></html>
