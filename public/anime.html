<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090910"><title>Anime details — Animexd</title>
<style>
:root{color-scheme:dark;--bg:#090910;--panel:#14141f;--line:#2c2b3d;--muted:#aaa8bd;--violet:#c2a2ff;--pink:#f58ac0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#302044,transparent 42%),var(--bg);color:#f8f6ff;font:15px/1.6 system-ui,Arial}a{color:inherit;text-decoration:none}.top{border-bottom:1px solid #ffffff13;background:#090910d9;backdrop-filter:blur(16px)}header{max-width:1120px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:950;letter-spacing:-1px}.brand span{color:var(--violet)}.back{font-size:13px;color:#d9c8f5}.wrap{max-width:1120px;margin:auto;padding:26px 18px 65px}.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(190px,290px) 1fr;gap:30px;align-items:center;padding:clamp(18px,4vw,35px);border:1px solid var(--line);border-radius:23px;background:linear-gradient(120deg,#1b1727,#101019 72%);box-shadow:0 20px 65px #0005}.poster{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:15px;background:#282039;box-shadow:0 14px 35px #0007}.eyebrow{font-size:11px;letter-spacing:2.5px;color:var(--violet);font-weight:900}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-1.2px;margin:10px 0}.overview{color:#c0bdcc;max-width:690px;white-space:pre-wrap}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{border:1px solid #614a7c;background:#3b285366;color:#e0caff;border-radius:30px;padding:6px 11px;font-size:12px}.section{margin-top:22px;padding:23px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#151520,#101018)}.section h2{font-size:20px;margin:0 0 16px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}.fact{padding:14px;border:1px solid #302e42;background:#1a1926;border-radius:12px;min-width:0}.fact small{display:block;color:#aaa5bb;font-size:10px;letter-spacing:1px;margin-bottom:5px}.fact b{overflow-wrap:anywhere}.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.screens img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:11px;background:#252333}.episode{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px;margin:10px 0;border:1px solid #302e42;background:#191824;border-radius:13px}.episode p{margin:3px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;border:0;background:linear-gradient(110deg,#9564df,#c15baf);color:white;padding:9px 13px;border-radius:10px;font-size:12px;font-weight:850;cursor:pointer}.btn.alt{background:#302d40}.empty{color:var(--muted);padding:20px;border:1px dashed #454258;border-radius:12px}.modal{position:fixed;inset:0;z-index:10;background:#000d;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{width:min(900px,100%);background:#11111b;border:1px solid #49415d;border-radius:17px;padding:15px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal video{width:100%;max-height:72vh;background:#000;border-radius:10px;margin-top:12px}footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}
@media(max-width:650px){.wrap{padding:18px 13px 45px}.hero{grid-template-columns:1fr;gap:18px}.poster{max-width:220px;margin:auto}.episode{align-items:flex-start;flex-direction:column}.section{padding:17px}}
</style></head><body><div class="top"><header><a class="brand" href="/">Anime<span>xd</span></a><a class="back" href="/">← Back to catalogue</a></header></div>
<main class="wrap" id="content"><div class="empty">Loading anime details…</div></main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><b id="modalTitle">Watch episode</b><button class="btn alt" id="close">Close ✕</button></div><video id="player" controls playsinline preload="metadata"></video><iframe id="embedPlayer" title="Embedded episode player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="display:none;width:100%;height:min(72vh,520px);border:0;border-radius:10px;margin-top:12px;background:#000"></iframe><p id="modalDesc" style="color:#aaa8bd"></p><a id="download" class="btn" download>↓ Download episode</a></div></div>
<footer>Animexd · Credits are for information and appreciation; they do not imply distribution rights.<br>Rights or removal request: <a href="mailto:zerogaming990776@gmail.com" style="color:#d5b9ff">Contact us</a></footer>
<script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');let episodes=[];
async function init(){try{if(!id)throw Error('No anime was selected.');const r=await fetch('/api/anime/'+encodeURIComponent(id));const a=await r.json();if(!r.ok)throw Error(a.error||'Anime not found.');episodes=a.episodes||[];document.title=a.title+' — Animexd';const chips=[a.year,a.genre,a.language].filter(Boolean);document.getElementById('content').innerHTML='<section class="hero"><img class="poster" src="'+esc(a.poster)+'" alt="'+esc(a.title)+' poster" onerror="this.style.visibility=\'hidden\'"><div><div class="eyebrow">ANIMEXD ORIGINAL CATALOGUE</div><h1>'+esc(a.title)+'</h1><p class="overview">'+esc(a.overview||'Story overview has not been added yet.')+'</p><div class="chips">'+chips.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div></div></section><section class="section"><h2>Anime information</h2><div class="facts"><div class="fact"><small>ANIMATION STUDIO</small><b>'+esc(a.studio||'Not added')+'</b></div><div class="fact"><small>WRITER / CREATOR</small><b>'+esc(a.writer||'Not added')+'</b></div><div class="fact"><small>RELEASE YEAR</small><b>'+esc(a.year||'Not added')+'</b></div><div class="fact"><small>AVAILABLE EPISODES</small><b>'+episodes.length+'</b></div></div></section><section class="section"><h2>Gallery</h2><div class="screens">'+(a.screenshots||[]).map(s=>'<img loading="lazy" src="'+esc(s)+'" alt="Anime screenshot" onerror="this.style.display=\'none\'">').join('')+'</div>'+(!(a.screenshots||[]).length?'<p class="overview">No gallery images added yet.</p>':'')+'</section><section class="section"><h2>Episodes <span style="font-size:12px;color:#aaa8bd;font-weight:500">('+episodes.length+')</span></h2>'+(episodes.length?episodes.map((e,i)=>'<div class="episode"><div><b>'+esc(e.title||('Episode '+(i+1)))+'</b><p>'+esc(e.description||'')+'</p></div><div class="actions"><button class="btn" onclick="watch(\''+esc(e.id)+'\')">▶ Watch</button><a class="btn alt" href="'+esc(e.videoUrl)+'" download>↓ Download</a></div></div>').join(''):'<div class="empty">No episodes linked to this anime yet.</div>')+'</section><p style="color:#88869a;font-size:12px;padding:5px 3px">Credits identify the creators and studios. Only content with distribution permission should be hosted or downloaded.</p>'}catch(e){document.getElementById('content').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function watch(id){const e=episodes.find(x=>x.id===id);if(!e)return;const v=document.getElementById('player'),f=document.getElementById('embedPlayer'),d=document.getElementById('download');document.getElementById('modalTitle').textContent=e.title;document.getElementById('modalDesc').textContent=e.description||'';if(e.videoMode==='embed'){v.pause();v.removeAttribute('src');v.style.display='none';f.src=e.videoUrl;f.style.display='block';d.style.display='none'}else{f.removeAttribute('src');f.style.display='none';v.style.display='block';v.src=e.videoUrl;d.href=e.videoUrl;d.style.display='inline-block'}document.getElementById('modal').classList.add('show')}
function close(){document.getElementById('player').pause();document.getElementById('player').removeAttribute('src');document.getElementById('embedPlayer').removeAttribute('src');document.getElementById('modal').classList.remove('show')}
document.getElementById('close').addEventListener('click',close);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});init();
</script></body></html>
